<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soil Moisture Network</title>

  <!-- ───── QUICK INLINE STYLES (move back to style.css later) ───── -->
  <style>
    /* ---------- reset + base ---------- */
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:#fafbfc;
      color:#111;
      line-height:1.4;
    }

    /* ---------- header ---------- */
    .header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:1rem;
      padding:0.75rem 1.25rem;
      background:#fff;
      border-bottom:2px solid #003d60;
      flex-wrap:wrap;
    }
    .branding{display:flex;align-items:center;gap:0.75rem}
    .branding img{height:42px}
    .branding h1{font-size:1.25rem;font-weight:600}

    .nav-links{display:flex;flex-wrap:wrap;gap:0.5rem}
    .nav-links button{
      background:#00588b;
      color:#fff;
      border:none;
      border-radius:4px;
      padding:0.45rem 0.75rem;
      font-size:0.9rem;
      cursor:pointer;
    }
    .nav-links button:hover{background:#003d60}

    /* ---------- main content ---------- */
    .content{max-width:1200px;margin-inline:auto;padding:1.5rem 1.25rem}
    .content h2{margin-bottom:1rem}

    .node-columns{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
      gap:1.5rem;
    }
    .node-column h3{margin-bottom:0.5rem}

    iframe{
      display:block;
      width:100%;
      height:260px;
      margin-bottom:1rem;
      border:1px solid #ccc;
      border-radius:4px;
    }

    /* ---------- footer ---------- */
    .footer{
      margin-top:2rem;
      padding:1rem;
      text-align:center;
      background:#f1f3f5;
      font-size:0.85rem;
    }
    .footer a{color:#00588b;text-decoration:none}
    .footer a:hover{text-decoration:underline}
  </style>
</head>

<body>
  <!-- ─────────── HEADER ─────────── -->
  <header class="header">
    <div class="branding">
      <a href="/"><img src="/assets/images/UMichBlock.svg" alt="University of Michigan logo" /></a>
      <h1>Benjamen&nbsp;D.&nbsp;Miller</h1>
    </div>

    <nav class="nav-links">
      <button onclick="location.href='/'">Home</button>
      <button onclick="location.href='/assets/resume.pdf'">PDF&nbsp;Resume</button>
      <button onclick="location.href='/projects/cygnss.html'">NASA&nbsp;CYGNSS</button>

      <!-- simple dropdown replacement -->
      <button onclick="location.href='/projects/'">Projects ▾</button>
    </nav>

  <!-- ─────────── MAIN ─────────── -->
  <main class="content">

      <!-- Node 2 -->

        <iframe src="https://thingspeak.com/channels/2996908/charts/3?bgcolor=%23ffffff&color=%23d62020&dynamic=true&results=60&type=line&update=15"></iframe>
      </div>
    </section>
  </main>

  <!-- ─────────── FOOTER ─────────── -->
