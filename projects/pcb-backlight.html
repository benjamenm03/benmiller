<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PCB Backlight</title>

  <!-- Tool-only CSS -->
  <link rel="stylesheet" href="../assets/pcb-backlight/app.css" />

  <!-- Third-party libs (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://unpkg.com/gerber-to-svg@^4.0.0/dist/gerber-to-svg.min.js"></script>
</head>
<body>
  <div id="backlight-app">
    <div class="shell">
      <header>
        <h1>PCB Backlight</h1>
        <div class="panel-row">
          <label class="btn">
            <input id="zipInput" type="file" accept=".zip" hidden />
            Load KiCad fabrication ZIP
          </label>
          <button id="calBtn" class="btn">Calibrate inches</button>
          <label class="switch"><input id="mirrorX" type="checkbox" /><span>Mirror X</span></label>
          <label class="switch"><input id="mirrorY" type="checkbox" /><span>Mirror Y</span></label>
        </div>
      </header>

      <main>
        <aside id="sidebar">
          <h2>Layers</h2>
          <ul id="layerList" class="list"></ul>

          <h2>Nets <small>(IPC-D-356)</small></h2>
          <input id="netSearch" placeholder="filter…" />
          <ul id="netList" class="list"></ul>

          <p class="hint">
            Tip: Include an IPC-D-356 file in your ZIP for a net list, or click traces directly.
          </p>
        </aside>

        <section id="viewer">
          <div id="paperRails" aria-hidden="true">
            <div id="railLeft"></div>
            <div id="railRight"></div>
            <div id="railBottom"></div>
          </div>
          <div id="board"></div>
          <div id="status">Idle</div>
        </section>
      </main>
    </div>

    <!-- Fullscreen backlight overlay -->
    <div id="blackout" class="hidden">
      <button id="exitFs" aria-label="Exit backlight">×</button>
      <div id="glow"></div>
    </div>

    <!-- Calibration modal -->
    <div id="calModal" class="modal hidden">
      <div class="modal-card">
        <h2>Calibrate inches</h2>
        <p>Use a ruler. Adjust until this bar measures exactly <b>4.00 in</b>.</p>
        <div id="calBar"></div>
        <input id="ppi" type="range" min="60" max="300" step="0.5" />
        <div class="row">
          <span id="ppiLabel"></span>
          <button id="calSave" class="btn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Tool-only JS -->
  <script src="../assets/pcb-backlight/app.js" type="module"></script>
</body>
</html>
