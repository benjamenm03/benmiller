<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA CYGNSS</title>
    <style>
        :root {
            --primary-color: #00274C;
            --secondary-color: #FFCB05;
            --background-color: #f8f9fa;
            --text-light: #ffffff;
            --shadow-color: rgba(0,0,0,0.2);
        }
        body {
            margin:0;
            font-family:'Arial',sans-serif;
            background-color:var(--background-color);
        }
        .header {
            background:var(--primary-color);
            color:var(--text-light);
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:20px 50px;
            box-shadow:0px 4px 10px var(--shadow-color);
            transition:padding 0.3s ease;
        }
        .header.shrink { padding:10px 50px; }
        .header.shrink .branding img { height:40px; }
        .header.shrink .branding h1 { font-size:20px; }
        .branding { display:flex; align-items:center; }
        .branding img { height:60px; margin-right:20px; }
        .branding h1 { color:var(--secondary-color); margin:0; font-size:24px; }
        .nav-links { display:flex; align-items:center; gap:10px; }
        .dropdown { position:relative; display:inline-block; }
        .dropdown button {
            background:var(--secondary-color);
            color:var(--primary-color);
            padding:10px 20px; font-size:16px; border:none; cursor:pointer; border-radius:5px;
        }
        .dropdown-content {
            display:none; position:absolute; background-color:var(--text-light);
            min-width:160px; box-shadow:0px 4px 10px var(--shadow-color); border-radius:5px; z-index:1;
        }
        .dropdown-content a {
            color:var(--primary-color); padding:12px 16px; text-decoration:none; display:block;
        }
        .dropdown-content a:hover { background-color:var(--background-color); }
        .dropdown:hover .dropdown-content { display:block; }
        .content { padding:20px; }
        .footer {
            text-align:center; padding:20px; background:var(--primary-color); color:var(--text-light); margin-top:20px;
        }
        .footer a { color:var(--secondary-color); text-decoration:none; font-weight:bold; }
        .footer a:hover { text-decoration:underline; }
    </style>
    <script>
        window.addEventListener('scroll',function(){
            var header=document.querySelector('.header');
            if(window.scrollY>50){ header.classList.add('shrink'); } else { header.classList.remove('shrink'); }
        });
    </script>
</head>
<body>
<div class="header">
    <div class="branding">
        <a href="index.html"><img src="figures/UMichBlock.svg" alt="University of Michigan Logo"></a>
        <h1>Benjamen D. Miller</h1>
    </div>
    <div class="nav-links">
        <div class="dropdown"><button onclick="window.location.href='resume.pdf'">PDF Resume</button></div>
        <div class="dropdown"><button onclick="window.location.href='https://aerial-estate.us'">Aerial Estate LLC</button></div>
        <div class="dropdown">
            <button>Projects</button>
            <div class="dropdown-content">
                <a href="Project1.html">NASA CYGNSS</a>
                <a href="Project2.html">Aerial Estate LLC</a>
                <a href="Project3.html">AETHER Space Weather Model</a>
                <a href="Project4.html">ENGR 100-950</a>
                <a href="Project5.html">ENGR 100-980</a>
            </div>
        </div>
    </div>
</div>

<div class="content">
    <h2>NASA CYGNSS</h2>
    <p>Details about the NASA CYGNSS project will go here.</p>
</div>

<div class="footer">
    <p>Contact: <a href="mailto:benjamen@umich.edu">benjamen@umich.edu</a> | Phone: (269) 635-3418 | <a href="https://www.linkedin.com/in/benjamen-miller-233012292" target="_blank" rel="noopener noreferrer">LinkedIn</a></p>
</div>
</body>
</html>
