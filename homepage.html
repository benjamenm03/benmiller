<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Personal website of Benjamen Miller, an Aerospace Engineering student at the University of Michigan College of Engineering, showcasing projects and professional experiences.">
    <title>Benjamen Miller - Aerospace Engineering</title>
    <style>
        :root {
            --primary-color: #00274C; /* Michigan Blue */
            --secondary-color: #FFCB05; /* Michigan Maize */
            --background-color: #f8f9fa;
            --text-light: #ffffff;
            --shadow-color: rgba(0, 0, 0, 0.2);
        }
        
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: var(--background-color);
        }
        .password-protect {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            background: var(--primary-color);
            color: var(--text-light);
            text-align: center;
            padding: 20px;
        }
        .password-protect h2 {
            color: var(--secondary-color);
            margin-bottom: 20px;
        }
        .password-input {
            padding: 10px;
            font-size: 16px;
            margin-bottom: 10px;
            border: 2px solid var(--secondary-color);
            border-radius: 5px;
            text-align: center;
        }
        .password-button {
            background: var(--secondary-color);
            color: var(--primary-color);
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        .password-button:hover {
            background: var(--text-light);
            color: var(--primary-color);
        }
    </style>
    <script>
        function checkPassword(event) {
            if (event.key === "Enter" || event.type === "click") {
                var password = document.getElementById("password").value;
                if (password === "testing") {
                    document.getElementById("main-content").style.display = "block";
                    document.getElementById("password-form").style.display = "none";
                } else {
                    alert("Incorrect password. Please try again.");
                }
            }
        }
    </script>
</head>
<body>
    <div id="password-form" class="password-protect">
        <h2>Enter Password</h2>
        <input type="password" id="password" class="password-input" placeholder="Password" onkeypress="checkPassword(event)">
        <button class="password-button" onclick="checkPassword(event)">Submit</button>
    </div>
    
    <div id="main-content" style="display: none;">
        <div class="header">
            <div class="branding">
                <img src="figures/UMichBlock.svg" alt="University of Michigan Logo">
                <h1>Benjamen Miller</h1>
            </div>
            <div class="dropdown">
                <button>Projects</button>
                <div class="dropdown-content">
                    <a href="Project1.html">Project 1</a>
                    <a href="Project2.html">Project 2</a>
                    <a href="Project3.html">Project 3</a>
                    <a href="Project4.html">Project 4</a>
                    <a href="Project5.html">Project 5</a>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>Contact: <a href="mailto:benjamen@umich.edu">benjamen@umich.edu</a> | Phone: (269) 635-3418 | <a href="https://www.linkedin.com/in/benjamen-miller-233012292" target="_blank" rel="noopener noreferrer">LinkedIn</a></p>
        </div>
    </div>
</body>
</html>
